<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Завантаження файлу</title>
    <link rel="stylesheet" href="/static/upload.css">
</head>
<body>

<div class="card">

    <h1>📄 Завантаження DBF файлу</h1>

    <form id="upload-form">

        <div class="drop-zone" id="drop-zone">

            <div class="drop-icon">📂</div>

            <div class="drop-title">
                Перетягніть DBF файл сюди
            </div>

            <div class="drop-subtitle">
                або натисніть для вибору файлу
            </div>

            <input
                type="file"
                id="file"
                name="file"
                accept=".dbf"
                required
            >

        </div>

        <div
            class="selected-file"
            id="selected-file"
        >
            Файл не вибрано
        </div>

        <div class="options">

            <label class="checkbox-label">

                <input
                    type="checkbox"
                    checked
                    id="filetype"
                    name="filetype"
                >

                файл є уточненням

            </label>

        </div>

        <div class="actions">

            <button type="submit">
                Завантажити
            </button>

        </div>

    </form>

    <div
        class="progress-container"
        id="progress-container"
    >
        <div class="progress-bar">
            <div
                class="progress-fill"
                id="progress-fill"
            ></div>
        </div>

        <div
            class="progress-text"
            id="progress-text"
        >
            0%
        </div>
    </div>

    <div id="upload-status"></div>

    <a
        href="/admin"
        class="back-link"
    >
        ← Повернутися до перегляду звітів
    </a>

</div>

<script>

    const form =
        document.getElementById('upload-form');

    const fileInput =
        document.getElementById('file');

    const dropZone =
        document.getElementById('drop-zone');

    const selectedFile =
        document.getElementById('selected-file');

    const statusDiv =
        document.getElementById('upload-status');

    const progressContainer =
        document.getElementById('progress-container');

    const progressFill =
        document.getElementById('progress-fill');

    const progressText =
        document.getElementById('progress-text');

    dropZone.addEventListener('click', () => {
        fileInput.click();
    });

    fileInput.addEventListener('change', () => {

        if (!fileInput.files.length) {
            return;
        }

        selectedFile.textContent =
            fileInput.files[0].name;
    });

    [
        'dragenter',
        'dragover'
    ].forEach(eventName => {

        dropZone.addEventListener(
            eventName,
            e => {

                e.preventDefault();

                dropZone.classList.add(
                    'dragover'
                );
            }
        );

    });

    [
        'dragleave',
        'drop'
    ].forEach(eventName => {

        dropZone.addEventListener(
            eventName,
            e => {

                e.preventDefault();

                dropZone.classList.remove(
                    'dragover'
                );
            }
        );

    });

    dropZone.addEventListener(
        'drop',
        e => {

            const files =
                e.dataTransfer.files;

            if (!files.length) {
                return;
            }

            fileInput.files = files;

            selectedFile.textContent =
                files[0].name;
        }
    );

    form.addEventListener(
        'submit',
        async (event) => {

            event.preventDefault();

            if (!fileInput.files.length) {
                return;
            }

            const file =
                fileInput.files[0];

            if (
                !file.name
                    .toLowerCase()
                    .endsWith('.dbf')
            ) {

                statusDiv.innerHTML =
                    '<span class="error">❌ Дозволені лише файли .dbf</span>';

                return;
            }

            const formData =
                new FormData();

            formData.append(
                'file',
                file
            );

            formData.append(
                'filetype',
                document.getElementById(
                    'filetype'
                ).checked
            );

            statusDiv.innerHTML =
                '<span class="info">Завантаження файлу...</span>';

            try {

                const uploadResponse =
                    await fetch(
                        '/upload',
                        {
                            method: 'POST',
                            body: formData
                        }
                    );

                const uploadData =
                    await uploadResponse.json();

                if (!uploadResponse.ok) {
                    throw new Error(
                        uploadData.detail ||
                        'Помилка завантаження'
                    );
                }

                if (
                    uploadData.status ===
                    'already_processed'
                ) {

                    statusDiv.innerHTML =
                        `<span class="info">
                        ℹ️ Файл вже був оброблений раніше
                        </span><br>
                        Статус: ${uploadData.processing_status}`;

                    return;
                }

                const jobId =
                    uploadData.job_id;

                progressContainer.style.display =
                    'block';

                const timer =
                    setInterval(
                        async () => {

                            try {

                                const response =
                                    await fetch(
                                        `/status/${jobId}`
                                    );

                                const data =
                                    await response.json();

                                const progress =
                                    data.progress || 0;

                                progressFill.style.width =
                                    progress + '%';

                                progressText.textContent =
                                    progress + '%';

                                statusDiv.innerHTML =
                                    `<span class="info">
                                    Статус: ${data.status}
                                    </span>`;

                                if (
                                    data.status ===
                                    'completed'
                                ) {

                                    clearInterval(
                                        timer
                                    );

                                    progressFill.style.width =
                                        '100%';

                                    progressText.textContent =
                                        '100%';

                                    statusDiv.innerHTML =
                                        '<span class="success">✅ Обробку завершено</span>';
                                }

                                if (
                                    data.status ===
                                    'failed'
                                ) {

                                    clearInterval(
                                        timer
                                    );

                                    statusDiv.innerHTML =
                                        `<span class="error">
                                        ❌ ${data.error || 'Помилка'}
                                        </span>`;
                                }

                            } catch (err) {

                                clearInterval(
                                    timer
                                );

                                statusDiv.innerHTML =
                                    '<span class="error">❌ Помилка отримання статусу</span>';
                            }

                        },
                        2000
                    );

            } catch (error) {

                statusDiv.innerHTML =
                    `<span class="error">
                    ❌ ${error.message}
                    </span>`;
            }

        }
    );

</script>

</body>
</html>
