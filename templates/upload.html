<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Завантаження файлу</title>

    <link rel="stylesheet" href="/static/upload.css">
</head>
<body>

<h1>Завантаження файлу</h1>

<form id="upload-form">
    <input type="file" id="file" name="file" accept=".dbf" required>

    <label for="filetype">
        Уточнення
        <input type="checkbox" checked id="filetype" name="filetype">
    </label>

    <button type="submit">Завантажити</button>
</form>

<hr>

<div id="upload-status"></div>

<progress
        id="progress-bar"
        value="0"
        max="100"
        style="width: 400px; display:none;"
></progress>

<a href="/admin">повернутись до перегляду звітів</a>

<script>

    const form = document.getElementById('upload-form');
    const statusDiv = document.getElementById('upload-status');
    const progressBar = document.getElementById('progress-bar');

    form.addEventListener('submit', async (event) => {

        event.preventDefault();

        const fileInput = document.getElementById('file');

        if (!fileInput.files.length) {
            return;
        }

        const selectedFile = fileInput.files[0];

        // Перевірка розширення на клієнті
        if (!selectedFile.name.toLowerCase().endsWith('.dbf')) {

            console.error(
                'Недопустимий тип файлу:',
                selectedFile.name
            );

            progressBar.style.display = 'none';

            statusDiv.innerHTML =
                '❌ Дозволені лише файли .dbf';

            return;
        }

        const formData = new FormData();
        formData.append('file', selectedFile);
        formData.append(
            'filetype',
            document.getElementById('filetype').checked
        );

        statusDiv.textContent = 'Завантаження файлу...';

        try {

            const uploadResponse = await fetch('/upload', {
                method: 'POST',
                body: formData
            });

            if (!uploadResponse.ok) {

                let errorMessage =
                    `Помилка завантаження (${uploadResponse.status})`;

                try {

                    const errorData =
                        await uploadResponse.json();

                    if (errorData.detail) {
                        errorMessage = errorData.detail;
                    }

                } catch (e) {

                    console.error(
                        'Не вдалося прочитати відповідь сервера:',
                        e
                    );

                }

                console.error(
                    'Upload failed:',
                    uploadResponse.status,
                    errorMessage
                );

                throw new Error(errorMessage);
            }

            const uploadData =
                await uploadResponse.json();

            console.log(
                'Upload response:',
                uploadData
            );

            if (uploadData.status === 'already_processed') {

                progressBar.style.display = 'none';

                statusDiv.innerHTML =
                    `ℹ️ Файл вже був оброблений раніше.<br>
                     Статус: ${uploadData.processing_status}`;

                return;
            }

            const jobId = uploadData.job_id;

            if (!jobId) {

                console.error(
                    'Відсутній job_id у відповіді:',
                    uploadData
                );

                throw new Error(
                    'Сервер не повернув ідентифікатор задачі'
                );
            }

            statusDiv.textContent =
                'Файл завантажено. Починається обробка...';

            progressBar.value = 0;
            progressBar.style.display = 'block';

            const timer = setInterval(async () => {

                try {

                    const statusResponse =
                        await fetch(`/status/${jobId}`);

                    if (!statusResponse.ok) {

                        console.error(
                            'Status request failed:',
                            statusResponse.status
                        );

                        clearInterval(timer);

                        statusDiv.textContent =
                            `Не вдалося отримати статус (${statusResponse.status})`;

                        return;
                    }

                    const statusData =
                        await statusResponse.json();

                    console.log(
                        'Status:',
                        statusData
                    );

                    progressBar.value =
                        statusData.progress || 0;

                    statusDiv.textContent =
                        `Статус: ${statusData.status}, ${statusData.progress || 0}%`;

                    if (statusData.status === 'completed') {

                        clearInterval(timer);

                        progressBar.value = 100;

                        statusDiv.innerHTML =
                            `✅ Обробку завершено (100%)`;
                    }

                    if (statusData.status === 'failed') {

                        clearInterval(timer);

                        progressBar.style.display = 'none';

                        statusDiv.innerHTML =
                            `❌ Помилка: ${statusData.error || 'невідома помилка'}`;
                    }

                } catch (error) {

                    console.error(
                        'Помилка перевірки статусу:',
                        error
                    );

                    clearInterval(timer);

                    statusDiv.innerHTML =
                        '❌ Помилка отримання статусу';
                }

            }, 2000);

        } catch (error) {

            console.error(
                'Upload error:',
                error
            );

            progressBar.style.display = 'none';

            statusDiv.innerHTML =
                `❌ ${error.message}`;
        }

    });

</script>

</body>
</html>
