<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Завантаження файлу</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family: "Segoe UI", Arial, sans-serif;

            background: #f4f6f9;

            display: flex;
            justify-content: center;
            align-items: flex-start;

            padding: 50px 20px;
        }

        .card {
            width: 100%;
            max-width: 650px;

            background: white;

            border-radius: 14px;

            padding: 30px;

            box-shadow:
                0 4px 12px rgba(0,0,0,.05),
                0 12px 30px rgba(0,0,0,.08);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 25px;

            color: #1f2937;
            text-align: center;
        }

        .drop-zone {
            border: 3px dashed #3b82f6;

            border-radius: 12px;

            padding: 40px 20px;

            text-align: center;

            cursor: pointer;

            transition: .2s;

            background: #f8fbff;
        }

        .drop-zone:hover {
            background: #eef6ff;
        }

        .drop-zone.dragover {
            background: #dbeafe;
            border-color: #2563eb;
            transform: scale(1.01);
        }

        .drop-icon {
            font-size: 42px;
            margin-bottom: 10px;
        }

        .drop-title {
            font-size: 18px;
            font-weight: 600;
            color: #1f2937;
        }

        .drop-subtitle {
            margin-top: 8px;
            color: #6b7280;
            font-size: 14px;
        }

        #file {
            display: none;
        }

        .selected-file {
            margin-top: 15px;

            padding: 12px;

            border-radius: 8px;

            background: #f3f4f6;

            color: #374151;

            word-break: break-all;
        }

        .options {
            margin-top: 20px;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 10px;

            font-size: 15px;
            color: #374151;
        }

        .actions {
            margin-top: 25px;
        }

        button {
            width: 100%;

            border: none;

            background: #2563eb;

            color: white;

            padding: 14px;

            border-radius: 8px;

            font-size: 16px;
            font-weight: 600;

            cursor: pointer;

            transition: .2s;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        .progress-container {
            display: none;
            margin-top: 25px;
        }

        .progress-bar {
            width: 100%;
            height: 22px;

            background: #e5e7eb;

            border-radius: 999px;

            overflow: hidden;
        }

        .progress-fill {
            width: 0%;

            height: 100%;

            background: #22c55e;

            transition: width .3s;
        }

        .progress-text {
            margin-top: 8px;
            text-align: center;
            font-size: 14px;
            color: #374151;
        }

        #upload-status {
            margin-top: 20px;

            padding: 14px;

            border-radius: 8px;

            background: #f9fafb;

            min-height: 50px;

            line-height: 1.5;
        }

        .success {
            color: #15803d;
            font-weight: 600;
        }

        .error {
            color: #dc2626;
            font-weight: 600;
        }

        .info {
            color: #2563eb;
            font-weight: 600;
        }

        .back-link {
            display: inline-block;
            margin-top: 25px;

            color: #2563eb;
            text-decoration: none;
        }

        .back-link:hover {
            text-decoration: underline;
        }

    </style>
</head>
<body>

<div class="card">

    <h1>📄 Завантаження DBF файлу</h1>

    <form id="upload-form">

        <div class="drop-zone" id="drop-zone">

            <div class="drop-icon">📂</div>

            <div class="drop-title">
                Перетягніть DBF файл сюди
            </div>

            <div class="drop-subtitle">
                або натисніть для вибору файлу
            </div>

            <input
                type="file"
                id="file"
                name="file"
                accept=".dbf"
                required
            >

        </div>

        <div
            class="selected-file"
            id="selected-file"
        >
            Файл не вибрано
        </div>

        <div class="options">

            <label class="checkbox-label">

                <input
                    type="checkbox"
                    checked
                    id="filetype"
                    name="filetype"
                >

                файл є уточненням

            </label>

        </div>

        <div class="actions">

            <button type="submit">
                Завантажити
            </button>

        </div>

    </form>

    <div
        class="progress-container"
        id="progress-container"
    >
        <div class="progress-bar">
            <div
                class="progress-fill"
                id="progress-fill"
            ></div>
        </div>

        <div
            class="progress-text"
            id="progress-text"
        >
            0%
        </div>
    </div>

    <div id="upload-status"></div>

    <a
        href="/admin"
        class="back-link"
    >
        ← Повернутися до перегляду звітів
    </a>

</div>

<script>

    const form =
        document.getElementById('upload-form');

    const fileInput =
        document.getElementById('file');

    const dropZone =
        document.getElementById('drop-zone');

    const selectedFile =
        document.getElementById('selected-file');

    const statusDiv =
        document.getElementById('upload-status');

    const progressContainer =
        document.getElementById('progress-container');

    const progressFill =
        document.getElementById('progress-fill');

    const progressText =
        document.getElementById('progress-text');

    dropZone.addEventListener('click', () => {
        fileInput.click();
    });

    fileInput.addEventListener('change', () => {

        if (!fileInput.files.length) {
            return;
        }

        selectedFile.textContent =
            fileInput.files[0].name;
    });

    [
        'dragenter',
        'dragover'
    ].forEach(eventName => {

        dropZone.addEventListener(
            eventName,
            e => {

                e.preventDefault();

                dropZone.classList.add(
                    'dragover'
                );
            }
        );

    });

    [
        'dragleave',
        'drop'
    ].forEach(eventName => {

        dropZone.addEventListener(
            eventName,
            e => {

                e.preventDefault();

                dropZone.classList.remove(
                    'dragover'
                );
            }
        );

    });

    dropZone.addEventListener(
        'drop',
        e => {

            const files =
                e.dataTransfer.files;

            if (!files.length) {
                return;
            }

            fileInput.files = files;

            selectedFile.textContent =
                files[0].name;
        }
    );

    form.addEventListener(
        'submit',
        async (event) => {

            event.preventDefault();

            if (!fileInput.files.length) {
                return;
            }

            const file =
                fileInput.files[0];

            if (
                !file.name
                    .toLowerCase()
                    .endsWith('.dbf')
            ) {

                statusDiv.innerHTML =
                    '<span class="error">❌ Дозволені лише файли .dbf</span>';

                return;
            }

            const formData =
                new FormData();

            formData.append(
                'file',
                file
            );

            formData.append(
                'filetype',
                document.getElementById(
                    'filetype'
                ).checked
            );

            statusDiv.innerHTML =
                '<span class="info">Завантаження файлу...</span>';

            try {

                const uploadResponse =
                    await fetch(
                        '/upload',
                        {
                            method: 'POST',
                            body: formData
                        }
                    );

                const uploadData =
                    await uploadResponse.json();

                if (!uploadResponse.ok) {
                    throw new Error(
                        uploadData.detail ||
                        'Помилка завантаження'
                    );
                }

                if (
                    uploadData.status ===
                    'already_processed'
                ) {

                    statusDiv.innerHTML =
                        `<span class="info">
                        ℹ️ Файл вже був оброблений раніше
                        </span><br>
                        Статус: ${uploadData.processing_status}`;

                    return;
                }

                const jobId =
                    uploadData.job_id;

                progressContainer.style.display =
                    'block';

                const timer =
                    setInterval(
                        async () => {

                            try {

                                const response =
                                    await fetch(
                                        `/status/${jobId}`
                                    );

                                const data =
                                    await response.json();

                                const progress =
                                    data.progress || 0;

                                progressFill.style.width =
                                    progress + '%';

                                progressText.textContent =
                                    progress + '%';

                                statusDiv.innerHTML =
                                    `<span class="info">
                                    Статус: ${data.status}
                                    </span>`;

                                if (
                                    data.status ===
                                    'completed'
                                ) {

                                    clearInterval(
                                        timer
                                    );

                                    progressFill.style.width =
                                        '100%';

                                    progressText.textContent =
                                        '100%';

                                    statusDiv.innerHTML =
                                        '<span class="success">✅ Обробку завершено</span>';
                                }

                                if (
                                    data.status ===
                                    'failed'
                                ) {

                                    clearInterval(
                                        timer
                                    );

                                    statusDiv.innerHTML =
                                        `<span class="error">
                                        ❌ ${data.error || 'Помилка'}
                                        </span>`;
                                }

                            } catch (err) {

                                clearInterval(
                                    timer
                                );

                                statusDiv.innerHTML =
                                    '<span class="error">❌ Помилка отримання статусу</span>';
                            }

                        },
                        2000
                    );

            } catch (error) {

                statusDiv.innerHTML =
                    `<span class="error">
                    ❌ ${error.message}
                    </span>`;
            }

        }
    );

</script>

</body>
</html>
